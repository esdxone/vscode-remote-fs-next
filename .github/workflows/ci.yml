name: CI

on:
  push:
    branches:
      - master
      - 'modernization/**'
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package VSIX
        run: npm run package -- --out remote-fs-next.vsix

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: remote-fs-next-vsix
          path: remote-fs-next.vsix
          if-no-files-found: error
